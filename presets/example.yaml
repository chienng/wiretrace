# Wiretrace preset: one file per project and environment.
# Copy this file to presets/<name>.yaml, set `name` to <name>, and list your API hosts.
# Start with: ./wiretrace start --preset <name>
#
# Keys Wiretrace does not know yet are ignored, so a preset can already carry
# settings for later features.

# Required. Must equal the file name without .yaml.
name: example

# Required. Host names only: no https://, no port, no path, no wildcard.
# Each host and all of its subdomains are decrypted, on any port; traffic to
# every other host passes through undecrypted.
api_hosts:
  - api-staging.example.com
  - auth-staging.example.com

# Optional. mitmproxy filter expression shown at start: the view filter in mitmweb,
# the print filter with --no-ui. It never limits what is saved.
# Examples: "~c 500", "~m POST", "~u /api/v1/orders", "!~t image".
default_filter: "!~t image"

# Optional. Folder of mock files, relative to the wiretrace folder (no absolute path, no "..").
# A file mocks/<name>/<METHOD>/<path>.json answers that request instead of the backend,
# for example mocks/example/GET/api/v1/profile.json answers GET /api/v1/profile.
# Default: mocks/<name>.
mocks_dir: mocks/example

# Optional. Request header whose value is shown as the flow comment in mitmweb.
# A header name: letters, digits and "-" only. Default: X-Request-ID.
request_id_header: X-Request-ID

# Optional. The app under test, so `./wiretrace start` can collect its device log into
# device.log.jsonl. Without the key for your --target, the device log is off and Wiretrace
# says so at start.
app:
  # --target android or android-emu: the app's package name, as in `adb shell pm list packages`.
  android_package: com.example.myapp
  # --target ios or ios-sim: the app's process name, as shown in Xcode or Console.
  # Letters, digits, spaces, '.', '_' and '-' only, up to 64 characters.
  ios_process: MyApp
